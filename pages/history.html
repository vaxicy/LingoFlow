<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoFlow - History</title>
  <link rel="stylesheet" href="../css/history.css">
</head>
<body>
  <div class="history-container">
    <!-- Header -->
    <div class="history-header">
      <div class="header-left">
        <h1 data-i18n="history_title">History</h1>
      </div>
      <div class="header-right">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" data-i18n-placeholder="search" placeholder="Search...">
        </div>
        <button class="btn-danger" id="clear-all-btn" data-i18n="clear_all">Clear All</button>
      </div>
    </div>

    <!-- Inline Clear-All Confirm Bar -->
    <div class="clear-confirm" id="clear-confirm" role="alertdialog" aria-live="polite" hidden>
      <span class="clear-confirm-text" id="clear-confirm-text">Clear all history?</span>
      <div class="clear-confirm-actions">
        <button class="clear-confirm-btn danger" id="confirm-clear-btn">Clear</button>
        <button class="clear-confirm-btn cancel" id="cancel-clear-btn">Cancel</button>
      </div>
    </div>

    <!-- History List -->
    <div class="history-list" id="history-list">
      <!-- Items will be dynamically added here -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display: none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <p data-i18n="no_history">No history yet</p>
      <p class="empty-hint" data-i18n="history_hint">Translation history will appear here</p>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/history.js"></script>
</body>
</html>
